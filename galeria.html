  <style>

:root{
  --bg:#F4F1EA;
  --bg-raised:#FBF8F1;
  --panel:#ECE5D3;
  --ink:#1B2B31;
  --ink-soft:#4E6067;
  --bay:#223A44;
  --dune:#8C743F;
  --dune-soft:#A98F5A;
  --horizon:#4E7986;
  --sun:#B3491E;
  --sun-soft:#C96A38;
  --line:rgba(34,58,68,0.14);
  --shadow: 0 20px 50px -30px rgba(27,43,49,0.35);
  --band-bg:#1C2E36;
  --band-ink:#F3EFE4;
  --band-ink-soft:#C9D6D6;
  --band-line:rgba(243,239,228,0.18);
  color-scheme: light;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121E23;
    --bg-raised:#182831;
    --panel:#1E313A;
    --ink:#F1ECDF;
    --ink-soft:#AFC0C1;
    --bay:#BFDCE3;
    --dune:#E4C588;
    --dune-soft:#D8B980;
    --horizon:#8FC0CB;
    --sun:#DB7A42;
    --sun-soft:#E89660;
    --line:rgba(241,236,223,0.14);
    --shadow: 0 20px 50px -28px rgba(0,0,0,0.6);
    --band-bg:#0B1519;
    --band-ink:#F3EFE4;
    --band-ink-soft:#B9C7C7;
    --band-line:rgba(243,239,228,0.16);
    color-scheme: dark;
  }
}

:root[data-theme="dark"]{
  --bg:#121E23;
  --bg-raised:#182831;
  --panel:#1E313A;
  --ink:#F1ECDF;
  --ink-soft:#AFC0C1;
  --bay:#BFDCE3;
  --dune:#E4C588;
  --dune-soft:#D8B980;
  --horizon:#8FC0CB;
  --sun:#DB7A42;
  --sun-soft:#E89660;
  --line:rgba(241,236,223,0.14);
  --shadow: 0 20px 50px -28px rgba(0,0,0,0.6);
  --band-bg:#0B1519;
  --band-ink:#F3EFE4;
  --band-ink-soft:#B9C7C7;
  --band-line:rgba(243,239,228,0.16);
  color-scheme: dark;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} }

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Manrope', -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

h1,h2,h3,.serif{
  font-family:'Fraunces', Georgia, 'Iowan Old Style', serif;
  font-weight:560;
  color:var(--ink);
  text-wrap:balance;
  margin:0;
}

p{ margin:0; }
a{ color:inherit; }
img,svg{ display:block; max-width:100%; }

.wrap{
  max-width:1180px;
  margin:0 auto;
  padding-inline:clamp(20px, 5vw, 56px);
}

/* ---------- nav ---------- */
.nav{
  position:sticky; top:0; z-index:40;
  background:var(--band-bg);
  border-bottom:1px solid var(--band-line);
}
.nav-utility{
  display:flex; align-items:center; justify-content:space-between;
  padding-block:7px;
  border-bottom:1px solid var(--band-line);
}
.nav-utility .nav-phone{ color:var(--band-ink-soft); font-size:0.78rem; }
.nav-utility .nav-phone svg{ width:14px; height:14px; }
.nav-utility .nav-phone:hover{ color:var(--sun); }
.nav-row{
  display:flex; align-items:center; justify-content:space-between;
  padding-block:14px;
}
.brand{ display:flex; align-items:center; gap:10px; text-decoration:none; }
.brand-mark{ width:30px; height:30px; flex:none; }
.brand-name{
  font-family:'Fraunces', serif; font-weight:560; font-size:1.08rem;
  letter-spacing:0.01em; color:var(--band-ink);
}
.nav-links{ display:flex; align-items:center; gap:26px; list-style:none; margin:0; padding:0; }
.nav-links a{
  text-decoration:none; font-size:0.8rem; font-weight:600;
  letter-spacing:0.08em; text-transform:uppercase; color:var(--band-ink-soft);
  transition:color .2s ease;
}
.nav-links a:hover, .nav-links a:focus-visible{ color:var(--sun); }
.nav-phone{
  display:inline-flex; align-items:center; gap:7px;
  color:var(--band-ink-soft); text-decoration:none;
  font-size:0.86rem; font-weight:600;
  transition:color .2s ease;
}
.nav-phone:hover{ color:var(--sun); }
.nav-phone svg{ width:17px; height:17px; flex:none; }
.nav-cta{
  display:inline-flex; align-items:center; gap:8px;
  background:var(--sun); color:#FBF8F1;
  padding:10px 18px; border-radius:3px; text-decoration:none;
  font-size:0.86rem; font-weight:700; letter-spacing:0.02em;
  transition:background .2s ease, transform .2s ease;
  white-space:nowrap;
}
.nav-cta:hover{ background:var(--sun-soft); }
.menu-btn{ display:none; background:none; border:none; color:var(--band-ink); padding:6px; cursor:pointer; }
.menu-btn svg{ width:24px; height:24px; }

@media (max-width: 760px){
  .nav-links{
    position:absolute; top:100%; left:0; right:0;
    flex-direction:column; align-items:flex-start; gap:0;
    background:var(--band-bg); border-bottom:1px solid var(--band-line);
    padding:8px clamp(20px,5vw,56px) 18px;
    display:none;
  }
  .nav-links.open{ display:flex; }
  .nav-links li{ width:100%; padding-block:12px; border-bottom:1px solid var(--band-line); }
  .menu-btn{ display:inline-flex; }
  .hero-grid{ grid-template-columns:1fr; }
  .hero-art{ aspect-ratio:16/10; }
  .intro-grid{ grid-template-columns:1fr; }
  .book-grid{ grid-template-columns:1fr; }
  .hero h1{ font-size:clamp(2rem, 8vw, 2.6rem); }
  .facts{ gap:12px 20px; }
  .amenity-groups{ gap:28px; }
}

@media (max-width: 480px){
  .hero-ctas{ flex-direction:column; align-items:stretch; }
  .btn{ justify-content:center; }
  .facts{ justify-content:space-between; }
  .fact{ flex-direction:column; align-items:flex-start; gap:2px; }
  .nav-utility .nav-phone span{ display:none; }
  .brand-name{ font-size:0.98rem; }
  .nav-row{ padding-block:12px; }
  .dist-list li{ flex-direction:column; align-items:flex-start; gap:2px; }
  .dist-list li span:last-child{ text-align:left; }
}

:focus-visible{ outline:2px solid var(--sun); outline-offset:3px; }

/* ---------- hero ---------- */
.hero{
  position:relative;
  padding-top:clamp(40px, 7vw, 76px);
  overflow:hidden;
}
.hero-grid{
  display:grid; grid-template-columns:1.05fr 0.95fr; gap:clamp(24px,4vw,64px);
  align-items:center; padding-bottom:clamp(48px,7vw,88px);
}
.eyebrow{
  font-family:'Manrope',sans-serif; font-size:0.82rem; font-weight:700;
  letter-spacing:0.14em; text-transform:uppercase; color:var(--dune);
  display:flex; align-items:center; gap:10px;
}
.eyebrow::before{ content:""; width:26px; height:1px; background:var(--dune); }
.hero h1{
  font-size:clamp(2.4rem, 4.6vw, 3.7rem);
  line-height:1.06; letter-spacing:-0.01em;
  margin-top:18px;
}
.hero h1 em{ font-style:italic; color:var(--sun); }
.hero-sub{
  margin-top:20px; max-width:46ch; font-size:1.08rem; color:var(--ink-soft);
}
.hero-ctas{ display:flex; flex-wrap:wrap; gap:14px; margin-top:32px; }
.btn{
  display:inline-flex; align-items:center; gap:10px;
  padding:14px 24px; border-radius:3px; text-decoration:none;
  font-weight:700; font-size:0.95rem; letter-spacing:0.01em;
  transition:background .2s ease, color .2s ease, border-color .2s ease, transform .15s ease;
  border:1px solid transparent;
}
.btn:active{ transform:translateY(1px); }
.btn-primary{ background:var(--sun); color:#FBF8F1; }
.btn-primary:hover{ background:var(--sun-soft); }
.btn-ghost{ border-color:var(--line); color:var(--ink); }
.btn-ghost:hover{ border-color:var(--dune); color:var(--dune); }
.btn svg{ width:18px; height:18px; }

.facts{
  display:flex; flex-wrap:wrap; gap:10px 28px; margin-top:44px;
  padding-top:26px; border-top:1px solid var(--line);
}
.fact{ display:flex; align-items:baseline; gap:8px; }
.fact strong{ font-family:'Fraunces',serif; font-size:1.3rem; font-weight:560; color:var(--bay); }
.fact span{ font-size:0.84rem; color:var(--ink-soft); }

.hero-art{ position:relative; aspect-ratio:4/3.1; }
.hero-photo{
  position:absolute; inset:0; border-radius:8px; overflow:hidden;
  background-color:var(--panel);
  box-shadow:var(--shadow); border:1px solid var(--line);
}
.hero-slide{
  position:absolute; inset:0; background-size:cover; background-position:center;
  opacity:0; transition:opacity 1.8s ease-in-out;
}
.hero-slide.is-active{ opacity:1; z-index:1; }
}
.hero-sun-badge{
  position:absolute; top:-18px; right:-14px; width:96px; height:96px;
  pointer-events:none;
}
.sun-disc{ transform-origin:center; }
@media (prefers-reduced-motion: no-preference){
  .sun-disc{ animation: glow 7s ease-in-out infinite; }
  .wave-line{ animation: drift 16s ease-in-out infinite; }
  .wave-line.w2{ animation-duration:20s; animation-direction:reverse; }
  .wave-line.w3{ animation-duration:24s; }
}
@keyframes glow{ 0%,100%{ opacity:1; } 50%{ opacity:.82; } }
@keyframes drift{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(10px); } }

/* ---------- section shells ---------- */
section{ padding-block:clamp(56px, 8vw, 108px); }
.section-head{ max-width:60ch; margin-bottom:clamp(28px,4vw,48px); }
.section-head .eyebrow{ margin-bottom:14px; }
.section-head h2{ font-size:clamp(1.7rem, 3vw, 2.3rem); }


/* ---------- intro / pull quote ---------- */
.intro{ background:var(--bg-raised); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.intro-grid{ display:grid; grid-template-columns:1.1fr 1fr; gap:clamp(32px,5vw,80px); align-items:start; }
.pull{
  font-family:'Fraunces',serif; font-style:italic; font-weight:460;
  font-size:clamp(1.4rem,2.4vw,1.9rem); line-height:1.35; color:var(--bay);
}
.intro-body p + p{ margin-top:16px; }
.intro-body{ color:var(--ink-soft); font-size:1.02rem; }
.intro-body strong{ color:var(--ink); font-weight:700; }

/* ---------- layout / plan ---------- */
.plan-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); }
.plan-item{ background:var(--bg); padding:26px 22px; display:flex; flex-direction:column; gap:14px; }
.plan-item svg{ width:26px; height:26px; color:var(--dune); }
.plan-item h3{ font-size:1.05rem; font-weight:600; font-family:'Manrope',sans-serif; }
.plan-item p{ font-size:0.9rem; color:var(--ink-soft); }

/* ---------- amenities ---------- */
.amenity-groups{ display:grid; gap:36px; }
.amenity-group h3{
  font-family:'Manrope',sans-serif; font-size:0.82rem; font-weight:700;
  letter-spacing:0.1em; text-transform:uppercase; color:var(--horizon); margin-bottom:14px;
}
.tag-row{ display:flex; flex-wrap:wrap; gap:10px; }
.tag{
  display:inline-flex; align-items:center; gap:8px;
  padding:9px 15px; border:1px solid var(--line); border-radius:2px;
  font-size:0.9rem; color:var(--ink);
  background:var(--bg-raised);
}
.tag svg{ width:15px; height:15px; color:var(--dune); flex:none; }

/* ---------- gallery ---------- */
.gallery{ display:grid; grid-template-columns:repeat(6,1fr); grid-auto-rows:170px; gap:14px; }
.g-item{
  position:relative; border-radius:3px; overflow:hidden; border:1px solid var(--line);
  display:flex; align-items:flex-end; padding:16px;
  background-color:var(--panel);
  background-size:cover; background-position:center;
  transition:background-size .5s ease;
}
.g-item:hover{ background-size:108%; }
.g-item::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(10,18,21,0) 45%, rgba(10,18,21,.68) 100%);
}
.g-item span{
  position:relative; z-index:2; color:#FBF8F1; font-size:0.86rem; font-weight:700;
  letter-spacing:0.02em; text-shadow:0 1px 6px rgba(0,0,0,0.35);
}

.g1{ grid-column:span 3; grid-row:span 2; }
.g2{ grid-column:span 3; grid-row:span 1; }
.g3{ grid-column:span 3; grid-row:span 1; }
.g4{ grid-column:span 2; grid-row:span 1; }
.g5{ grid-column:span 2; grid-row:span 1; }
.g6{ grid-column:span 2; grid-row:span 1; }
.gallery-note{ margin-top:16px; font-size:0.84rem; color:var(--ink-soft); }
.g-item{ cursor:zoom-in; }
.g-item:focus-visible{ outline:2px solid var(--sun); outline-offset:-2px; }
.g-item .zoom-hint{
  position:absolute; top:12px; right:12px; z-index:2;
  width:30px; height:30px; border-radius:50%;
  background:rgba(10,18,21,0.55); backdrop-filter:blur(2px);
  display:flex; align-items:center; justify-content:center;
  opacity:0; transform:scale(.85); transition:opacity .2s ease, transform .2s ease;
}
.g-item .zoom-hint svg{ width:15px; height:15px; color:#FBF8F1; }
.g-item:hover .zoom-hint, .g-item:focus-visible .zoom-hint{ opacity:1; transform:scale(1); }

/* ---------- lightbox ---------- */
.lightbox{
  display:none; position:fixed; inset:0; z-index:200;
  background:rgba(8,14,17,0.92); backdrop-filter:blur(4px);
  align-items:center; justify-content:center; padding:clamp(20px,5vw,56px);
}
.lightbox.open{ display:flex; }
.lightbox-figure{ margin:0; max-width:100%; max-height:100%; display:flex; flex-direction:column; align-items:center; gap:14px; }
.lightbox-figure img{
  max-width:min(1080px,100%); max-height:82vh; width:auto; height:auto;
  border-radius:4px; box-shadow:0 30px 70px -20px rgba(0,0,0,0.6);
}
.lightbox-figure figcaption{
  color:#F3EFE4; font-size:0.92rem; letter-spacing:0.02em; text-align:center;
}
.lightbox-close{
  position:absolute; top:20px; right:20px; z-index:2;
  width:42px; height:42px; border-radius:50%; border:1px solid rgba(243,239,228,0.3);
  background:rgba(243,239,228,0.08); color:#F3EFE4;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  transition:background .2s ease, transform .2s ease;
}
.lightbox-close:hover{ background:rgba(243,239,228,0.18); }
.lightbox-close svg{ width:18px; height:18px; }

@media (max-width:820px){
  .gallery{ grid-template-columns:repeat(2,1fr); grid-auto-rows:150px; }
  .g1{ grid-column:span 2; grid-row:span 1; }
  .g2,.g3,.g4,.g5,.g6{ grid-column:span 1; }
}

.gallery-cta{ margin-top:24px; text-align:center; }
@keyframes gallery-shake{
  0%,100%{ transform:translateX(0); }
  20%{ transform:translateX(-6px); }
  40%{ transform:translateX(6px); }
  60%{ transform:translateX(-4px); }
  80%{ transform:translateX(4px); }
}
.gallery-cta .btn.attn{
  animation:gallery-shake .5s ease;
  box-shadow:0 0 0 6px rgba(200,90,34,0.25);
}

/* ---------- location ---------- */
.loc{ background:var(--bg-raised); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.loc-grid{ display:flex; flex-direction:column; gap:clamp(32px,5vw,48px); }
.loc-intro{ max-width:64ch; }
.loc-intro .dist-list{ max-width:46ch; }
.addr{ font-family:'Fraunces',serif; font-size:1.3rem; margin-top:6px; }
.dist-list{ list-style:none; margin:26px 0 0; padding:0; display:grid; gap:14px; }
.dist-list li{ display:flex; justify-content:space-between; gap:16px; padding-bottom:14px; border-bottom:1px solid var(--line); font-size:0.96rem; }
.dist-list li span:first-child{ color:var(--ink-soft); }
.dist-list li span:last-child{ font-weight:700; color:var(--bay); font-variant-numeric:tabular-nums; text-align:right; }
.map-col{ max-width:860px; }
.sat-map{
  position:relative; aspect-ratio:1200/772; border-radius:8px; overflow:hidden;
  box-shadow:var(--shadow); border:1px solid var(--line);
  background-color:#EDEDED; background-size:cover; background-position:center;
}
.poi{ position:absolute; display:flex; align-items:center; gap:9px; transform:translate(-27px,-27px); }
.poi-icon{
  width:54px; height:54px; border-radius:50%; flex:none;
  background:#1C2E36; display:flex; align-items:center; justify-content:center;
  box-shadow:0 3px 10px rgba(0,0,0,0.28);
}
.poi-icon svg{ width:24px; height:24px; }
.poi-icon--home{ background:#C85A22; }
.poi-text{ display:flex; flex-direction:column; line-height:1.25; }
.poi-text .t{ font-size:0.78rem; font-weight:600; color:#1F2A2E; white-space:nowrap; }
.poi-text .d{ font-size:0.82rem; font-weight:800; color:#C85A22; white-space:nowrap; }
.poi--home .poi-text .t{ font-size:0.82rem; font-weight:800; color:#1C2E36; }.map-note{ margin-top:10px; font-size:0.78rem; color:var(--ink-soft); text-align:right; }

/* ---------- booking band ---------- */
.book{
  background:
    linear-gradient(160deg, rgba(9,16,19,.87) 0%, rgba(9,16,19,.72) 55%, rgba(9,16,19,.9) 100%),
    var(--book-photo) center 35%/cover no-repeat,
    var(--band-bg);
  color:var(--band-ink);
}
.book h2, .book .eyebrow{ color:var(--band-ink); }
.book .eyebrow::before{ background:var(--sun-soft); }
.book-grid{ display:grid; grid-template-columns:1.1fr 0.9fr; gap:clamp(32px,5vw,72px); align-items:center; }
.price-row{ display:flex; align-items:baseline; gap:10px; margin-top:6px; }
.price{ font-family:'Fraunces',serif; font-size:clamp(2.6rem,5vw,3.6rem); font-weight:560; color:var(--sun-soft); }
.price-unit{ font-size:1rem; color:var(--band-ink-soft); }
.book-terms{ list-style:none; margin:26px 0 0; padding:0; display:grid; gap:12px; }
.book-terms li{ display:flex; gap:12px; align-items:flex-start; font-size:0.96rem; color:var(--band-ink); }
.book-terms svg{ width:18px; height:18px; flex:none; margin-top:2px; color:var(--sun-soft); }
.book-card{
  background:rgba(243,239,228,0.06); border:1px solid var(--band-line);
  border-radius:4px; padding:clamp(28px,4vw,40px); text-align:center;
}
.book-card p.lead{ font-size:1.05rem; color:var(--band-ink); margin-bottom:22px; }
.book-card .btn-primary{ width:100%; justify-content:center; padding:16px 24px; font-size:1rem; }
.book-card .or{
  display:flex; align-items:center; gap:12px; margin:22px 0 16px;
  font-size:0.78rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--band-ink-soft);
}
.book-card .or::before, .book-card .or::after{ content:""; flex:1; height:1px; background:var(--band-line); }
.phone-link{
  font-family:'Fraunces',serif; font-size:clamp(1.5rem,2.6vw,1.9rem);
  color:var(--band-ink); text-decoration:none; letter-spacing:0.01em;
  display:inline-block; border-bottom:2px solid var(--sun-soft); padding-bottom:4px;
}
.book-card .hint{ margin-top:16px; font-size:0.86rem; color:var(--band-ink-soft); }

/* ---------- footer ---------- */
footer{ padding-block:44px; }
.foot-grid{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:20px; align-items:center; }
.foot-brand{ display:flex; align-items:center; gap:10px; }
.foot-brand .brand-mark{ width:22px; height:22px; }
.foot-links{ display:flex; gap:24px; list-style:none; margin:0; padding:0; font-size:0.86rem; }
.foot-links a{ text-decoration:none; color:var(--ink-soft); }
.foot-links a:hover{ color:var(--sun); }
.foot-note{ font-size:0.8rem; color:var(--ink-soft); margin-top:18px; }
/* ---------- gallery page (galeria.html) ---------- */
.back-link{
  display:inline-flex; align-items:center; gap:8px;
  font-size:0.9rem; color:var(--ink-soft); text-decoration:none;
  margin-bottom:20px;
}
.back-link:hover{ color:var(--sun); }
.section-head h1{ font-size:clamp(1.7rem, 3vw, 2.3rem); }
.full-gallery{
  display:grid; grid-template-columns:repeat(3,1fr); grid-auto-rows:300px; gap:16px; margin-top:12px;
}
.g-photo{
  position:relative; display:block; width:100%; height:100%; padding:0; margin:0;
  border-radius:3px; overflow:hidden; border:1px solid var(--line);
  background:var(--panel); cursor:zoom-in;
}
.g-photo img{
  width:100%; height:100%; object-fit:cover; display:block;
  transition:transform .5s ease;
}
.g-photo:hover img{ transform:scale(1.08); }
.g-photo:focus-visible{ outline:2px solid var(--sun); outline-offset:-2px; }
.g-photo .zoom-hint{
  position:absolute; top:12px; right:12px; z-index:2;
  width:30px; height:30px; border-radius:50%;
  background:rgba(10,18,21,0.55); backdrop-filter:blur(2px);
  display:flex; align-items:center; justify-content:center;
  opacity:0; transform:scale(.85); transition:opacity .2s ease, transform .2s ease;
}
.g-photo .zoom-hint svg{ width:15px; height:15px; color:#FBF8F1; }
.g-photo:hover .zoom-hint, .g-photo:focus-visible .zoom-hint{ opacity:1; transform:scale(1); }
@media (max-width:900px){
  .full-gallery{ grid-template-columns:repeat(2,1fr); grid-auto-rows:260px; }
}
@media (max-width:560px){
  .full-gallery{ grid-template-columns:1fr; grid-auto-rows:240px; }
}  </style>

<script>
(function(){
  var btn = document.getElementById('menuBtn');
  var links = document.getElementById('navLinks');
  btn.addEventListener('click', function(){
    var open = links.classList.toggle('open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  links.addEventListener('click', function(e){
    if (e.target.closest('a')){
      links.classList.remove('open');
      btn.setAttribute('aria-expanded','false');
    }
  });
})();

(function(){
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightboxImg');
  var lightboxCaption = document.getElementById('lightboxCaption');
  var closeBtn = document.getElementById('lightboxClose');
  var lastFocused = null;

  function openLightbox(item){
    var img = item.querySelector('img');
    if(!img) return;
    lightboxImg.src = img.src;
    lightboxImg.alt = img.alt || '';
    lightboxCaption.textContent = '';
    lastFocused = document.activeElement;
    lightbox.classList.add('open');
    lightbox.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    closeBtn.focus();
  }

  function closeLightbox(){
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    lightboxImg.src = '';
    if(lastFocused){ lastFocused.focus(); }
  }

  document.querySelectorAll('.g-photo').forEach(function(item){
    item.addEventListener('click', function(){ openLightbox(item); });
    item.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        openLightbox(item);
      }
    });
  });

  closeBtn.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', function(e){
    if(e.target === lightbox){ closeLightbox(); }
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && lightbox.classList.contains('open')){ closeLightbox(); }
  });
})();
</script>
